name: CI

on: push

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '16.x'
          cache: 'npm'

      - name: Install dependencies 🔧
        run: npm ci

      - name: Lint ✅
        run: npm run lint

      - name: Build 🏗️
        run: npm run build
